x-obscura-common: &obscura-common
  image: h4ckf0r0day/obscura:latest
  command: ["serve", "--port", "9222", "--host", "0.0.0.0", "--stealth"]
  restart: unless-stopped

x-worker-common: &worker-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  stop_grace_period: 35s

x-worker-env: &worker-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: appdb
  DB_USER: appuser
  DB_PASSWORD: apppass
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318
  MAX_THREADS: 1
  PROCESSING_TIMEOUT_SECONDS: 900
  GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS: 30
  MINER_PAGE_ISOLATION_ENABLED: true
  MINER_PAGE_HARD_TIMEOUT_SECONDS: 15
  BROWSER_BACKEND: obscura
  OBSCURA_CDP_CONNECT_TIMEOUT_SECONDS: 60
  DATABASE_URL: mysql+pymysql://appuser:apppass@mysql:3306/appdb
  OTEL_SERVICE_NAME: miner
  OTEL_SERVICE_VERSION: 1.0.0
  OTEL_ENV: dev
  MINER_TELEMETRY_ENABLED: false
  SAVE_HTML: False
  MAX_CHARACTERS_TEXT: 1000000
  PREFLIGHT_ENABLED: true
  PREFLIGHT_TIMEOUT_MS: 2000
  BODY_READY_TIMEOUT_MS: 1000
  TEXT_FALLBACK_TIMEOUT_MS: 1000
  HREF_EXTRACTION_TIMEOUT_MS: 1000
  PLAYWRIGHT_DEFAULT_TIMEOUT_MS: 5000
  REQUESTER_TOTAL_TIMEOUT_SECONDS: 10

services:
  mysql:
    image: mysql:8.0.45
    container_name: mysql
    environment:
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - ./container_data/mysql_data:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d:ro
      - ./container_data/mysql_logs:/var/log/mysql
    command:
      - --slow_query_log=1
      - --slow_query_log_file=/var/log/mysql/slow.log
      - --long_query_time=0.5
      - --log_queries_not_using_indexes=0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "8080:80"
    restart: unless-stopped

